name: Build and Sign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  build:
    name: Build EXE (Windows)
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller retrokauz_launcher.spec --noconfirm

      - name: Upload unsigned EXE
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/retrokauz_launcher.exe
          retention-days: 1

  sign:
    name: Sign EXE (SignPath)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'retrokauz-launcher'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'exe-signing'
          github-artifact-id: '${{ needs.build.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed/'

      - name: Upload signed EXE
        uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: signed/retrokauz_launcher.exe
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download signed EXE
        uses: actions/download-artifact@v4
        with:
          name: signed-exe
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/retrokauz_launcher.exe
          generate_release_notes: true
